<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCH Profile Maker</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef1f5;
  font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color:#263142;
}

.app{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:20px;
  padding:18px;
}

.panel,.previewWrap{
  background:#ffffff;
  border:1px solid #dfe4ea;
  border-radius:12px;
  padding:22px;
}

h1{margin-top:0;font-size:28px}

label{
  display:block;
  font-size:13px;
  font-weight:900;
  color:#7b8998;
  margin-top:16px;
}

input,textarea,select{
  width:100%;
  margin-top:6px;
  padding:10px 12px;
  border:1px solid #d4dce5;
  border-radius:8px;
  font-family:inherit;
  font-size:14px;
}

input.colorOverride{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

/* ===== color picker rows ===== */
.colorPick{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
}
.colorPick input[type="color"]{
  width:42px;
  min-width:42px;
  height:34px;
  padding:2px;
  border:1px solid #d4dce5;
  border-radius:8px;
  cursor:pointer;
  background:#fff;
}
.colorPick input[type="text"]{
  margin-top:0;
  flex:1;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase;
}

.colorPanel{
  margin-top:14px;
  border:1px solid #e1e6ec;
  border-radius:10px;
  background:#fafbfc;
  overflow:hidden;
}
.colorPanel > summary{
  cursor:pointer;
  list-style:none;
  padding:14px 16px;
  font-weight:900;
  font-size:14px;
  color:#3a4658;
  background:#f0f3f7;
  user-select:none;
}
.colorPanel > summary::-webkit-details-marker{display:none}
.colorPanel > summary::before{content:"▸ ";color:#8a97a6}
.colorPanel[open] > summary::before{content:"▾ "}
.colorPanel .panelInner{padding:6px 16px 16px}

.detailColor{
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  gap:10px;
  padding:9px 0;
  border-bottom:1px dashed #e3e8ee;
}
.detailColor:last-child{border-bottom:0}
.detailColor .dcLabel{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  font-weight:700;
  color:#52606e;
}
.detailColor .dcLabel input[type="checkbox"]{
  width:16px;
  min-width:16px;
  height:16px;
  margin:0;
  cursor:pointer;
}
.detailColor .dcLabel small{
  display:block;
  font-weight:500;
  color:#97a3b0;
  font-size:11px;
}
.detailColor .dcCtrls{
  display:flex;
  align-items:center;
  gap:6px;
  opacity:.4;
  transition:opacity .15s;
}
.detailColor.active .dcCtrls{opacity:1}
.detailColor .dcCtrls input[type="color"]{
  width:38px;min-width:38px;height:30px;padding:2px;
  border:1px solid #d4dce5;border-radius:7px;cursor:pointer;background:#fff;
}
.detailColor .dcCtrls input[type="text"]{
  margin-top:0;width:88px;padding:6px 8px;font-size:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;
}
.colorPanel .resetBtn{
  margin-top:14px;width:100%;padding:10px;border:1px solid #d4dce5;
  border-radius:8px;background:#fff;color:#52606e;font-weight:800;font-size:13px;cursor:pointer;
}

textarea{
  min-height:92px;
  resize:vertical;
}

button{
  margin-top:18px;
  width:100%;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#263142;
  color:white;
  font-weight:900;
  cursor:pointer;
}

.profile{
  --profileWidth:857px;
  --main:#2f86e8;
  --deep:#163c91;
  --soft:#f3f8ff;
  --row:#e4f0ff;
  --box:#eaf3ff;
  --line:#0f5fd2;
  --alertBox:#eaf3ff;
  --alertText:#163c91;
  --alertTitle:#2f86e8;
  --alertBar:#0f5fd2;
  --alertDark:rgba(47,134,232,.14);
  --abilityDark:#15171a;
  --overheatDark:rgba(47,134,232,.08);
  --overheatTitle:#8ecfff;
  --overheatBar:#45aaff;
  --guideMain:#168bd8;
  --guideDeep:#183a56;
  --guideSoft:#f7fbfd;
  --guideRow:#e6f2f8;
  --guideBox:#eaf5fb;
  --guideLine:#168bd8;
  --guideText:#314b66;
  --heroAccent:var(--main);
  --guideHeroAccent:var(--guideMain);
  --abilityNameColor:var(--main);
  --guideAbilityNameColor:var(--guideMain);
  --skillNameColor:var(--main);
  --guideSkillNameColor:var(--guideMain);
  --overheatNameColor:var(--overheatTitle);
  --guideOverheatNameColor:var(--guideMain);

  max-width:var(--profileWidth);
  margin:auto;
  overflow:hidden;
  border-radius:12px;
}

.profile.guide{
  background:#ffffff;
  color:var(--guideText);
}

.profile.sentinel{
  background:#0f1115;
  color:#f4f6f8;
}

.hero{
  position:relative;
  width:100%;
  height:0;
  padding-top:72%;
  overflow:hidden;
  background-color:#111;
  background-image:var(--hero-image);
  background-size:cover;
  background-position:var(--hero-x, 50%) var(--hero-y, 50%);
  background-repeat:no-repeat;
  border-bottom:4px solid var(--line);
}

.hero img{
  display:none;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.78) 0%,
    rgba(0,0,0,.48) 38%,
    rgba(0,0,0,.08) 80%
  );
}

.badge{
  position:absolute;
  z-index:2;
  top:28px;
  right:32px;
  padding:10px 18px;
  border-radius:7px;
  background:var(--heroAccent);
  color:#fff;
  font-size:14px;
  font-weight:950;
  letter-spacing:2px;
}

.guide .badge{
  background:var(--guideHeroAccent);
  color:#fff;
}

.guide .hero{
  border-bottom-color:var(--guideLine);
}

.guide .threat{
  color:var(--guideHeroAccent);
}

.heroText{
  position:absolute;
  z-index:2;
  left:44px;
  bottom:44px;
  color:#fff;
}

.threat{
  font-size:16px;
  font-weight:950;
  letter-spacing:4px;
  color:var(--heroAccent);
  text-shadow:0 2px 8px rgba(0,0,0,.65);
}

.name{
  font-size:70px;
  line-height:1;
  font-weight:950;
  margin:10px 0 16px;
  color:#fff;
  text-shadow:0 4px 10px rgba(0,0,0,.55);
}

.catchphrase{
  max-width:760px;
  font-size:17px;
  font-weight:500;
  line-height:1.65;
  color:#dedede;
  text-shadow:0 2px 8px rgba(0,0,0,.65);
}

.content{
  padding:38px 34px 44px;
}

.card{
  border-radius:12px;
  padding:34px 32px;
  margin-bottom:28px;
}

.guide .card{
  background:var(--guideSoft);
  border:1px solid rgba(24,58,86,.10);
}

.sentinel .card{
  background:#191a1c;
  border:1px solid #2b2d31;
}

.sectionTitle{
  font-size:24px;
  font-weight:900;
  letter-spacing:1.6px;
  color:var(--deep);
  margin-bottom:12px;
}

.guide .sectionTitle{
  color:var(--guideMain);
}

.guide .card:first-child .sectionTitle{
  color:var(--guideDeep);
}

.sentinel .sectionTitle{
  color:var(--main);
}

.sentinel .card:first-child .sectionTitle{
  color:#fff;
}

.sentinel .card:not(:first-child) .sectionTitle{
  letter-spacing:1.4px;
}

.line{
  height:2px;
  background:var(--line);
  margin-bottom:22px;
}

.guide .line{
  background:#d8dde2;
}

.guide .card:first-child .line{
  background:var(--guideLine);
}

.sentinel .card:not(:first-child) .line{
  background:#4a4a4a;
  height:2px;
}

.infoRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  border-radius:6px;
  padding:14px 20px;
  margin-bottom:12px;
  font-size:15px;
}

.guide .infoRow{
  background:var(--guideRow);
}

.sentinel .infoRow{
  background:#111214;
}

.infoRow b:first-child{
  color:var(--main);
  letter-spacing:.5px;
}

.guide .infoRow b:first-child{
  color:#5d7184;
}

.sentinel .infoRow b:first-child{
  color:#b9b9b9;
}

.infoRow b:last-child{
  color:var(--deep);
  text-align:right;
}

.guide .infoRow b:last-child{
  color:var(--guideDeep);
}

.guide .infoRow.attributeRow b:last-child{
  color:var(--guideMain);
}

.sentinel .infoRow b:last-child{
  color:#fff;
}

.sentinel .infoRow.attributeRow b:last-child{
  color:var(--main);
}

.evalTitle{
  margin-top:36px;
  margin-bottom:14px;
  font-size:16px;
  font-weight:900;
  color:var(--main);
}

.guide .evalTitle{
  color:#5d7184;
}

.sentinel .card:first-child .evalTitle{
  color:#b9b9b9;
}

.quoteBox{
  border-left:5px solid var(--line);
  border-radius:0 7px 7px 0;
  padding:18px 22px;
  font-size:15px;
  line-height:1.72;
  font-style:italic;
}

.guide .quoteBox{
  border-left-color:var(--guideLine);
  background:var(--guideBox);
  color:var(--guideText);
}

.sentinel .quoteBox{
  background:var(--alertDark);
  color:#f4f6f8;
}

.abilityBox,
.overheatBox{
  position:relative;
  overflow:hidden;
  border-radius:7px;
  padding:14px 18px 14px 22px;
  font-size:14px;
  line-height:1.58;
}

.abilityBox::before,
.overheatBox::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  border-radius:999px;
  background:var(--line);
}

.guide .abilityBox::before{
  background:var(--guideLine);
}

.abilityBox{
  margin-bottom:20px;
}

.guide .abilityBox{
  background:rgba(24,58,86,.045);
  color:var(--guideText);
}

.sentinel .abilityBox{
  background:var(--abilityDark);
  color:#f4f6f8;
}

.abilityBox h3{
  margin:0 0 7px;
  font-size:16px;
  color:var(--deep);
}

.titleSub{
  color:#a9a9ad;
  font-weight:600;
}

.guide .abilityBox .titleSub{
  color:var(--guideAbilityNameColor);
  opacity:.85;
}

.sentinel .abilityBox .titleSub{
  color:var(--abilityNameColor);
  opacity:.75;
}

.guide .abilityBox h3{
  color:var(--guideAbilityNameColor);
}

.sentinel .abilityBox h3{
  color:var(--abilityNameColor);
}

.skillSection{
  margin:0 0 22px;
}

.skillTitle{
  margin:0 0 10px;
  color:#b9b9b9;
  font-size:14px;
  font-weight:750;
  letter-spacing:.8px;
}

.guide .skillTitle{
  color:#5d7184;
}

.majorSkillList{
  margin:0;
  padding:0;
  list-style:none;
  font-size:14px;
  line-height:1.62;
}

.majorSkillList li{
  position:relative;
  padding-left:16px;
  margin:0 0 7px;
}

.majorSkillList li::before{
  content:"";
  position:absolute;
  left:0;
  top:.86em;
  width:5px;
  height:5px;
  border-radius:50%;
  background:var(--main);
}

.guide .majorSkillList li::before{
  background:var(--guideMain);
}

.skillName{
  color:var(--skillNameColor);
  font-weight:900;
}

.guide .skillName{
  color:var(--guideSkillNameColor);
}

.skillNameMuted{
  font-weight:900;
  color:inherit;
}

.overheatBox::before{
  background:var(--overheatBar);
}

.guide .overheatBox::before{
  background:var(--guideLine);
}

.guide .overheatBox{
  background:var(--guideBox);
  color:var(--guideText);
}

.sentinel .overheatBox{
  background:var(--overheatDark);
  color:#f4f0ef;
}

.overheatBox h3{
  margin:0 0 7px;
  color:var(--overheatNameColor);
  font-size:16px;
}

.guide .overheatBox h3{
  color:var(--guideOverheatNameColor);
}

.guide .overheatBox .overheatList{
  margin-top:4px;
}

.guide .overheatBox .overheatList li{
  margin-bottom:8px;
}

.guide .overheatBox .overheatList li:last-child{
  margin-bottom:0;
}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .name{font-size:52px}
  .heroText{left:28px;bottom:30px}
  .content{padding:26px}
  .card{padding:28px 24px}
}
</style>
</head>

<body>
<div class="app">

  <div class="panel">
    <h1>ARCH Profile Maker</h1>

    <label>타입</label>
    <select id="type">
      <option value="sentinel">Sentinel</option>
      <option value="guide">Guide</option>
    </select>

    <label>속성</label>
    <select id="element">
      <option value="water">물 속성</option>
      <option value="fire">불 속성</option>
      <option value="thunder">번개 속성</option>
      <option value="ice">얼음 속성</option>
      <option value="grass">풀 속성</option>
      <option value="wind">바람 속성</option>
      <option value="none">무속성</option>
    </select>

    <label>상단 이미지</label>
    <input type="file" id="image" accept="image/*">

    <label>이미지 가로 위치</label>
    <input type="range" id="heroX" min="0" max="100" value="50">

    <label>이미지 세로 위치</label>
    <input type="range" id="heroY" min="0" max="100" value="50">

    <label>등급 배지</label>
    <input id="badge" placeholder="A / S / C">

    <label>위협 등급</label>
    <input id="threat" placeholder="THREAT LEVEL: BEFORE THE RIPPLE">

    <label>등급 배지 / 위협 등급 색상</label>
    <div class="colorPick">
      <input type="color" id="heroAccentColor_pick" value="#2f86e8">
      <input type="text" id="heroAccentColor" class="colorOverride" placeholder="비우면 속성 기본색">
    </div>

    <label>상단 코드네임</label>
    <input id="name">

    <label>프로필 코드네임</label>
    <input id="profileName" placeholder="루비 (Ruby)">

    <label>캐치프레이즈</label>
    <textarea id="catchphrase"></textarea>

    <label>분류</label>
    <input id="classification">

    <label>나이 / 국적</label>
    <input id="age">

    <label>공식 평가</label>
    <textarea id="official"></textarea>

    <label>프로필 섹션 제목</label>
    <input id="profileSectionTitle" placeholder="AGENT PROFILE / GUIDE PROFILE">

    <label>능력 섹션 제목</label>
    <input id="abilitySectionTitle" placeholder="ABILITY OVERVIEW / ABILITY & GEAR">

    <label>능력명</label>
    <input id="abilityName">

    <label>능력명 색상</label>
    <div class="colorPick">
      <input type="color" id="abilityNameColor_pick" value="#ffd21f">
      <input type="text" id="abilityNameColor" class="colorOverride" placeholder="비우면 속성 기본색">
    </div>

    <label>능력 설명</label>
    <textarea id="abilityText"></textarea>

    <label>중간 목록 제목</label>
    <input id="skillSectionTitle" placeholder="MAJOR SKILLS / SPECIAL NOTES / CHARM POINTS">

    <label>중간 목록 내용</label>
    <textarea id="skillText" placeholder="퀸즈 블레이드: 거대한 화염 대검을 소환해 적을 내려칩니다."></textarea>

    <label>스킬명 색상</label>
    <div class="colorPick">
      <input type="color" id="skillNameColor_pick" value="#ffd21f">
      <input type="text" id="skillNameColor" class="colorOverride" placeholder="비우면 속성 기본색">
    </div>

    <label>하단 강조 제목</label>
    <input id="overheatName" placeholder="폭주 징조: 과열 (OVERHEAT) / Guiding Buff & Special Gear">

    <label>폭주명 색상</label>
    <div class="colorPick">
      <input type="color" id="overheatNameColor_pick" value="#ffc08a">
      <input type="text" id="overheatNameColor" class="colorOverride" placeholder="비우면 속성 기본색">
    </div>

    <label>하단 강조 설명</label>
    <textarea id="overheatText" placeholder="Guide: 줄바꿈으로 항목 구분. ':' 앞은 자동 강조. 강조 없이 굵게만 하려면 **라벨**로 감싸기 (예: **핵심 가이딩 버프: 오토에임(AUTO AIM)** 대상의 시각적 초점을...)"></textarea>

    <details class="colorPanel" id="detailColorPanel">
      <summary>세부 색상 직접 지정 (체크한 항목만 적용)</summary>
      <div class="panelInner" id="detailColorList">
        <!-- detail color rows injected by JS -->
        <button type="button" class="resetBtn" onclick="resetDetailColors()">세부 색상 전체 초기화</button>
      </div>
    </details>

    <button onclick="saveImage()">이미지로 저장</button>
    <button onclick="saveHero()" style="margin-top:8px;background:#3a4658;">상단 헤더만 저장</button>
  </div>

  <div class="previewWrap">
    <div id="preview"></div>
  </div>

</div>

function esc(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;");
}

function nl2br(str){
  return esc(str).replaceAll("\n","<br>");
}

function formatBadge(str){
  const value = String(str || "").trim().toUpperCase();
  if(!value) return "";
  if(value.includes("CLASS ENTITY")) return esc(value);
  return `${esc(value.replace(/-?CLASS$/,""))}-CLASS ENTITY`;
}

function formatBracketLabel(str){
  const value = String(str || "").trim().toUpperCase();
  if(!value) return "";
  if(value.startsWith("[") && value.endsWith("]")) return esc(value);
  return `[ ${esc(value)} ]`;
}

function formatTitle(str){
  const safe = esc(str);
  return safe.replace(/\s*(\([^()]+\))$/, ` <span class="titleSub">$1</span>`);
}

function colorValue(id){
  const value = String(document.getElementById(id).value || "").trim();
  return /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.test(value) ? value : "";
}

/* ===== color picker <-> hex text sync for the 4 main override fields ===== */
["heroAccentColor","abilityNameColor","skillNameColor","overheatNameColor"].forEach(id=>{
  const txt = document.getElementById(id);
  const pick = document.getElementById(id+"_pick");
  if(!txt || !pick) return;
  pick.addEventListener("input", ()=>{ txt.value = pick.value.toUpperCase(); render(); });
  txt.addEventListener("input", ()=>{
    const v = colorValue(id);
    if(v && /^#[0-9a-fA-F]{6}$/.test(v)) pick.value = v;
  });
});

/* ===== detailed per-item color overrides ===== */
/* Each item maps a label to one or more CSS variables it should drive.
   `def` is the fallback color shown in the picker before activation. */

  { id:"d_line",      label:"구분선 / 헤더 하단 바", vars:["line","guideLine"],          def:"#2f86e8" },
  { id:"d_section",   label:"섹션 제목",            vars:["deep","guideDeep","main","guideMain"], def:"#163c91" },
  { id:"d_soft",      label:"카드 배경",            vars:["soft","guideSoft"],          def:"#f3f8ff" },
  { id:"d_row",       label:"정보 행 배경",         vars:["row","guideRow"],            def:"#e4f0ff" },
  { id:"d_box",       label:"인용/박스 배경",       vars:["box","guideBox","alertBox"], def:"#eaf3ff" },
  { id:"d_quoteText", label:"본문/평가 텍스트",      vars:["guideText","alertText"],     def:"#314b66" },
  { id:"d_overheatBar", label:"하단 강조 좌측 바",   vars:["overheatBar"],               def:"#45aaff" },
  { id:"d_overheatTitle", label:"하단 강조 제목(센티넬)", vars:["overheatTitle"],         def:"#8ecfff" }
];

function buildDetailColorRows(){
  const list = document.getElementById("detailColorList");
  const resetBtn = list.querySelector(".resetBtn");
  DETAIL_COLORS.forEach(item=>{
    const row = document.createElement("div");
    row.className = "detailColor";
    row.id = "row_"+item.id;
    row.innerHTML = `
      <div class="dcLabel">
        <input type="checkbox" id="${item.id}_on">
        <span>${item.label}</span>
      </div>
      <div class="dcCtrls">
        <input type="color" id="${item.id}_pick" value="${item.def}">
        <input type="text" id="${item.id}_hex" value="${item.def.toUpperCase()}">
      </div>`;
    list.insertBefore(row, resetBtn);

    const chk  = row.querySelector(`#${item.id}_on`);
    const pick = row.querySelector(`#${item.id}_pick`);
    const hex  = row.querySelector(`#${item.id}_hex`);

    const syncActive = ()=> row.classList.toggle("active", chk.checked);
    chk.addEventListener("change", ()=>{ syncActive(); render(); });
    pick.addEventListener("input", ()=>{
      hex.value = pick.value.toUpperCase();
      if(!chk.checked){ chk.checked = true; syncActive(); }
      render();
    });
    hex.addEventListener("input", ()=>{
      const v = hex.value.trim();
      if(/^#[0-9a-fA-F]{6}$/.test(v)){
        pick.value = v;
        if(!chk.checked){ chk.checked = true; syncActive(); }
        render();
      }
    });
  });
}

function detailOverrideVars(){
  let css = "";
  DETAIL_COLORS.forEach(item=>{
    const chk = document.getElementById(item.id+"_on");
    if(!chk || !chk.checked) return;
    const hex = document.getElementById(item.id+"_hex");
    const v = String(hex.value || "").trim();
    if(!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)) return;
    item.vars.forEach(varName=>{ css += `--${varName}:${v};`; });
  });
  return css;
}

function resetDetailColors(){
  DETAIL_COLORS.forEach(item=>{
    const chk = document.getElementById(item.id+"_on");
    if(chk){ chk.checked = false; document.getElementById("row_"+item.id).classList.remove("active"); }
  });
  render();
}

buildDetailColorRows();

function skillList(str){
  const lines = String(str || "")
    .split("\n")
    .map(line => {
      const trimmed = line.trim();
      // If line starts with **, don't strip — that's markdown, not a bullet char
      if(trimmed.startsWith("**")) return trimmed;
      return trimmed.replace(/^[•*\-]\s*/, "");
    })
    .filter(Boolean);

  if(!lines.length) return "";

  return lines.map(line => {
    // Check for **...** wrapped label at start (muted/non-accent bold)
    const mutedMatch = line.match(/^\*\*([^*]+)\*\*(.*)$/);
    if(mutedMatch){
      const labelText = esc(mutedMatch[1]);
      const rest = esc(mutedMatch[2]);
      return `<li><span class="skillNameMuted">${labelText}</span>${rest}</li>`;
    }

    const safe = esc(line);
    const divider = safe.indexOf(":");

    if(divider === -1){
      return `<li>${safe}</li>`;
    }

    const skillName = safe.slice(0, divider + 1);
    const skillDesc = safe.slice(divider + 1);
    return `<li><span class="skillName">${skillName}</span>${skillDesc}</li>`;
  }).join("");
}

function getVars(p){
  return `
    --main:${p.main};
    --deep:${p.deep};
    --soft:${p.soft};
    --row:${p.row};
    --box:${p.box};
    --line:${p.line};
    --alertBox:${p.alertBox};
    --alertText:${p.alertText};
    --alertTitle:${p.alertTitle};
    --alertBar:${p.alertBar};
    --alertDark:${p.alertDark};
    --abilityDark:${p.abilityDark || p.alertDark};
    --overheatDark:${p.overheatDark || p.alertDark};
    --overheatTitle:${p.overheatTitle || p.alertTitle};
    --overheatBar:${p.overheatBar || p.alertBar};
    --guideMain:${p.guideMain || p.main};
    --guideDeep:${p.guideDeep || p.deep};
    --guideSoft:${p.guideSoft || p.soft};
    --guideRow:${p.guideRow || p.row};
    --guideBox:${p.guideBox || p.box};
    --guideLine:${p.guideLine || p.line};
    --guideText:${p.guideText || p.deep};
  `;
}

function buildHTML(){
  const type = document.getElementById("type").value;
  const element = document.getElementById("element").value;
  const p = palettes[element];

  const badge = formatBadge(document.getElementById("badge").value);
  const threat = formatBracketLabel(document.getElementById("threat").value);
  const name = esc(document.getElementById("name").value).toUpperCase();
  const profileName = esc(document.getElementById("profileName").value) || name;
  const catchphrase = nl2br(document.getElementById("catchphrase").value);
  const classification = esc(document.getElementById("classification").value);
  const age = esc(document.getElementById("age").value);
  const official = nl2br(document.getElementById("official").value);
  const defaultProfileTitle = type === "guide" ? "GUIDE PROFILE" : "AGENT PROFILE";
  const defaultAbilityTitle = type === "guide" ? "ABILITY & GEAR" : "ABILITY OVERVIEW";
  const profileSectionTitle = esc(document.getElementById("profileSectionTitle").value) || defaultProfileTitle;
  const abilitySectionTitle = esc(document.getElementById("abilitySectionTitle").value) || defaultAbilityTitle;
  const abilityName = formatTitle(document.getElementById("abilityName").value);
  const abilityText = nl2br(document.getElementById("abilityText").value);
  const skillSectionTitle = esc(document.getElementById("skillSectionTitle").value) || "MAJOR SKILLS";
  const skillText = skillList(document.getElementById("skillText").value);
  const overheatName = esc(document.getElementById("overheatName").value);
  const overheatTextRaw = document.getElementById("overheatText").value;
  const overheatText = nl2br(overheatTextRaw);
  const overheatList = skillList(overheatTextRaw);
  const heroX = document.getElementById("heroX").value;
  const heroY = document.getElementById("heroY").value;
  const heroAccentColor = colorValue("heroAccentColor");
  const abilityNameColor = colorValue("abilityNameColor");
  const skillNameColor = colorValue("skillNameColor");
  const overheatNameColor = colorValue("overheatNameColor");
  const overrideVars = `
    ${heroAccentColor ? `--heroAccent:${heroAccentColor}; --guideHeroAccent:${heroAccentColor};` : ""}
    ${abilityNameColor ? `--abilityNameColor:${abilityNameColor}; --guideAbilityNameColor:${abilityNameColor};` : ""}
    ${skillNameColor ? `--skillNameColor:${skillNameColor}; --guideSkillNameColor:${skillNameColor};` : ""}
    ${overheatNameColor ? `--overheatNameColor:${overheatNameColor}; --guideOverheatNameColor:${overheatNameColor};` : ""}
  `;

  return `
<div class="profile ${type}" style="${getVars(p)} ${overrideVars} ${detailOverrideVars()}">
  <div class="hero" style="background-image:${imageSrc ? `url(&quot;${imageSrc}&quot;)` : `none`}; --hero-x:${heroX}%; --hero-y:${heroY}%;">
    <div class="badge">${badge}</div>
    <div class="heroText">
      <div class="threat">${threat}</div>
      <div class="name">${name}</div>
      <div class="catchphrase">${catchphrase}</div>
    </div>
  </div>

  <div class="content">

    <div class="card">
      <div class="sectionTitle">${profileSectionTitle}</div>
      <div class="line"></div>

      <div class="infoRow"><b>CODE NAME</b><b>${profileName}</b></div>
      <div class="infoRow"><b>CLASSIFICATION</b><b>${classification}</b></div>
      <div class="infoRow attributeRow"><b>ATTRIBUTE</b><b>${p.label}</b></div>
      <div class="infoRow"><b>AGE/NATIONALITY</b><b>${age}</b></div>

      <div class="evalTitle">OFFICIAL EVALUATION</div>
      <div class="quoteBox">"${official}"</div>
    </div>

    <div class="card">
      <div class="sectionTitle">${abilitySectionTitle}</div>
      <div class="line"></div>

      <div class="abilityBox">
        <h3>${abilityName}</h3>
        ${abilityText}
      </div>

      ${type === "guide" ? `` : `
      <div class="skillSection">
        <div class="skillTitle">${skillSectionTitle}</div>
        <ul class="majorSkillList">${skillText}</ul>
      </div>
      `}

      <div class="overheatBox">
        <h3>${overheatName}</h3>
        ${type === "guide" && overheatList
          ? `<ul class="majorSkillList overheatList">${overheatList}</ul>`
          : overheatText}
      </div>
    </div>

  </div>
</div>`;
}

function updateFieldVisibility(){
  const type = document.getElementById("type").value;
  const isGuide = type === "guide";
  const skillFieldIds = ["skillSectionTitle", "skillText", "skillNameColor"];
  skillFieldIds.forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const label = el.previousElementSibling;
    if(isGuide){
      el.disabled = true;
      el.style.opacity = ".4";
      if(label && label.tagName === "LABEL"){
        if(!label.dataset.origText) label.dataset.origText = label.textContent;
        label.textContent = label.dataset.origText + "  (Guide 미사용)";
        label.style.opacity = ".5";
      }
    } else {
      el.disabled = false;
      el.style.opacity = "";
      if(label && label.tagName === "LABEL" && label.dataset.origText){
        label.textContent = label.dataset.origText;
        label.style.opacity = "";
      }
    }
  });
}

function render(){
  updateFieldVisibility();
  const html = buildHTML();
  document.getElementById("preview").innerHTML = html;
}

function saveImage(){
  captureAndDownload("#preview .profile", "arch-profile.png");
}

function saveHero(){
  captureAndDownload("#preview .profile .hero", "arch-profile-hero.png");
}

function captureAndDownload(selector, filename){
  const target = document.querySelector(selector);
  if(!target){ alert("먼저 미리보기를 생성해주세요."); return; }

  html2canvas(target, {
    scale: 2,
    useCORS: true,
    allowTaint: true,
    backgroundColor: null
  }).then(canvas => {
    const link = document.createElement("a");
    link.download = filename;
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

render();
